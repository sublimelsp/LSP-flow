name: Smoke test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Not on Windows: there, flow reports diagnostics, but never answers LSP's shutdown request, so the session
        # doesn't end and the smoke test fails.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Lets an organization variable choose the LSP ref to test against, see
      # https://github.com/sublimelsp/lsp_smoke_test#testing-against-an-lsp-branch
      LSP_SMOKE_TEST_LSP_REF: ${{ vars.LSP_SMOKE_TEST_LSP_REF }}
    steps:
      - uses: actions/checkout@v7

      # The package runs the flow binary from node_modules next to .flowconfig.
      - name: Install flow-bin
        run: npm install --prefix tests/smoke --no-save --no-package-lock flow-bin

      # On Linux and macOS, .bin/flow is a symlink to flow-bin's cli.js, which the smoke test's copy of the fixture
      # turns into a file that can't find the rest of flow-bin. Put the native binary there instead. (On Windows,
      # .bin/flow.cmd refers to cli.js by a relative path, which survives the copy.)
      - name: Use the native flow binary
        if: runner.os != 'Windows'
        working-directory: tests/smoke/node_modules
        run: mv "$(node -p 'require("flow-bin")')" .bin/flow

      - uses: sublimelsp/lsp_smoke_test@v1

  # A single check whose name doesn't depend on the os matrix, for rulesets to require. It runs even when the workflow
  # is cancelled: a skipped job counts as passing for a required check.
  result:
    name: Smoke test result
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check smoke test result
        env:
          RESULT: ${{ needs.smoke.result }}
        run: |
          echo "Smoke test result: $RESULT"
          test "$RESULT" = success
