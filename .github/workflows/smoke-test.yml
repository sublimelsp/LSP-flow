name: Smoke test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # The package runs the flow binary from node_modules next to .flowconfig.
      - name: Install flow-bin
        run: npm install --prefix tests/smoke --no-save --no-package-lock flow-bin

      # On Linux and macOS, .bin/flow is a symlink to flow-bin's cli.js, which the smoke test's copy of the fixture
      # turns into a file that can't find the rest of flow-bin. Put the native binary there instead. (On Windows,
      # .bin/flow.cmd refers to cli.js by a relative path, which survives the copy.)
      - name: Use the native flow binary
        if: runner.os != 'Windows'
        working-directory: tests/smoke/node_modules
        run: mv "$(node -p 'require("flow-bin")')" .bin/flow

      - uses: sublimelsp/lsp_smoke_test@v1
